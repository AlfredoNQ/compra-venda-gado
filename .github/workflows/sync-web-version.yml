name: Sincronizar versao Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-web-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Web v95 - cache novo e deleted_records
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('index.html','app-v68.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'/v85-fixes\.js\?v=\d+', '/v85-fixes.js?v=95', s)
              s=s.replace('Compra e Venda de Gado — v94','Compra e Venda de Gado — v95')
              p.write_text(s,encoding='utf-8')

          p=Path('v85-fixes.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('v94 fixes','v95 fixes')
              s=s.replace("APP_WEB_VERSION='94'","APP_WEB_VERSION='95'")
              s=s.replace("pdf94_","pdf95_")
              s=s.replace("gado_deleted_records_permanent_v94","gado_deleted_records_permanent_v95")
              s=s.replace("data-app-version','94'","data-app-version','95'")
              s=s.replace("Compra e Venda de Gado — v94","Compra e Venda de Gado — v95")
              s=s.replace("s.textContent='v94'","s.textContent='v95'")
              s=s.replace("b.textContent='v94'","b.textContent='v95'")
              p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v68.html v85-fixes.js
          if ! git diff --cached --quiet; then
            git commit -m 'v95 Web: força deleted_records sem cache antigo'
            git push origin main
          fi
