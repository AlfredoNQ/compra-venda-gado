name: Apply v96 Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v85-fixes.js"
      - ".github/workflows/apply-v85.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar v96 nos HTMLs
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ['index.html','app-v68.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("setInterval(()=>{if(navigator.onLine)sync(false)},8000);", "/* v96: polling legado desativado; sincronização fica por alteração/reconexão */")
              # Remove qualquer quantidade de tags antigas/duplicadas do sincronizador.
              s=re.sub(r'\s*<script src="/v85-fixes\.js\?v=\d+"></script>\s*', '\n', s)
              # Adiciona exatamente uma tag imediatamente antes do fechamento do body.
              s=s.replace('</body>','<script src="/v85-fixes.js?v=96"></script>\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html
          git diff --cached --quiet || git commit -m "Web v96: sincronizador único"
          git push
