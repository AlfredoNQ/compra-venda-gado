name: Apply v101 Web Stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v85-fixes.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/apply-v85.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar login persistente do Web
        shell: python
        run: |
          from pathlib import Path
          import re

          for name in ['index.html','app-v68.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')

              # Web: sessão Supabase persistida deve manter a interface aberta.
              s=re.sub(
                  r"\n\s*if\(navigator\.onLine\)\{\s*bootLoginApproved=false;\s*setAuthenticatedUI\(false\);\s*setCloudStatus\('Acesso protegido • entre novamente','warn'\);.*?\n\s*\}else\{\s*await onCloudSession\(session\);\s*\}",
                  "\n  if(session && session.user){ bootLoginApproved=true; }\n  await onCloudSession(session);",
                  s,
                  flags=re.S
              )
              s=re.sub(
                  r"\n\s*if\(navigator\.onLine && !bootLoginApproved\)\{\s*cloudUser=session\?\.user\|\|null;\s*setAuthenticatedUI\(false\);\s*setCloudStatus\('Acesso protegido • entre novamente','warn'\);\s*return;\s*\}",
                  "\n    if(session && session.user){ bootLoginApproved=true; cloudUser=session.user; }",
                  s,
                  flags=re.S
              )

              # Remove o experimento de reconexão v98 do Web para não interferir no navegador.
              s=re.sub(r'\s*<script src="/v98-reconnect-login\.js\?v=\d+"></script>\s*', '\n', s)
              s=re.sub(r'\s*<script src="/v101-apk-session-guard\.js\?v=\d+"></script>\s*', '\n', s)
              s=re.sub(r'\s*<script src="/v85-fixes\.js\?v=\d+"></script>\s*', '\n', s)
              s=s.replace("setInterval(()=>{if(navigator.onLine)sync(false)},8000);", "/* v101: polling legado desativado */")
              s=re.sub(r'manifest\.webmanifest\?v=\d+','manifest.webmanifest?v=101',s)
              s=re.sub(r"navigator\.serviceWorker\.register\('/sw\.js\?v=\d+'","navigator.serviceWorker.register('/sw.js?v=101'",s)
              s=s.replace('</body>','<script src="/v85-fixes.js?v=101"></script>\n</body>')
              p.write_text(s,encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html
          git diff --cached --quiet || git commit -m "Web v101: restaurar sessão persistente sem guard do APK"
          git push
