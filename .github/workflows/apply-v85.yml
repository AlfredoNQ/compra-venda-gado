name: Apply v98 Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v85-fixes.js"
      - "v98-reconnect-login.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/apply-v85.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar v98 nos HTMLs
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ['index.html','app-v68.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("setInterval(()=>{if(navigator.onLine)sync(false)},8000);", "/* v98: polling legado desativado */")
              s=re.sub(r'\s*<script src="/v85-fixes\.js\?v=\d+"></script>\s*', '\n', s)
              s=re.sub(r'\s*<script src="/v98-reconnect-login\.js\?v=\d+"></script>\s*', '\n', s)
              s=re.sub(r'manifest\.webmanifest\?v=\d+','manifest.webmanifest?v=98',s)
              s=re.sub(r"navigator\.serviceWorker\.register\('/sw\.js\?v=\d+'","navigator.serviceWorker.register('/sw.js?v=98'",s)
              inject='''<script src="/v85-fixes.js?v=98"></script>
<script src="/v98-reconnect-login.js?v=98"></script>\n</body>'''
              s=s.replace('</body>',inject)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html
          git diff --cached --quiet || git commit -m "Web v98: manter login na reconexão"
          git push
