name: Apply v97 Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v85-fixes.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/apply-v85.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar v97 nos HTMLs
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ['index.html','app-v68.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("setInterval(()=>{if(navigator.onLine)sync(false)},8000);", "/* v97: polling legado desativado */")
              s=re.sub(r'\s*<script src="/v85-fixes\.js\?v=\d+"></script>\s*', '\n', s)
              s=s.replace('manifest.webmanifest?v=23','manifest.webmanifest?v=97')
              s=s.replace('</body>','''<script>
(function(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js?v=97',{updateViaCache:'none'}).then(function(reg){
    try{reg.update();}catch(e){}
  }).catch(function(){});
})();
</script>
<script src="/v85-fixes.js?v=97"></script>\n</body>''')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html
          git diff --cached --quiet || git commit -m "Web v97: renovar cache PWA do iPhone"
          git push
