name: Apply v85 Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v85-fixes.js"
      - ".github/workflows/apply-v85.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar v85 nos HTMLs
        shell: python
        run: |
          from pathlib import Path
          for name in ['index.html','app-v68.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('Sync v84','v85')
              s=s.replace('— v84','— v85')
              s=s.replace('>v84</span>','>v85</span>')
              s=s.replace('data-app-version="78"','data-app-version="85"')
              tag='<script src="/v85-fixes.js?v=85"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html
          git diff --cached --quiet || git commit -m "Web v85: PDF, reconexao e versao"
          git push
