name: Gerar APK Compra e Venda de Gado

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Restaurar ícone original
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/app-boi-512.png" -o android-app/app/src/main/res/drawable/app_boi.png
          test -s android-app/app/src/main/res/drawable/app_boi.png

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recuperar assinatura oficial
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android-app/app-release.jks
          test -s android-app/app-release.jks

      - name: Gerar APK release assinado
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ../app-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease

      - name: Verificar identidade do aplicativo
        shell: bash
        run: |
          set -e
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.alfredo.compravendagado.offline"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "183"
          echo "APK oficial: com.alfredo.compravendagado.offline v183"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: compra-venda-gado-v182-oficial
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
