name: Gerar APK Compra e Venda de Gado

on:
  push:
    branches: [main, fix/offline-v184]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
      - "*.html"
      - "*.js"
      - "*.webmanifest"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recuperar assinatura oficial
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android-app/app-release.jks
          test -s android-app/app-release.jks

      - name: Gerar APK release assinado
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ../app-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Verificar identidade do aplicativo
        shell: bash
        run: |
          set -e
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.alfredo.compravendagado.offline"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "184"
          python3 android-app/prepare_offline.py --verify-apk "$APK"
          echo "APK oficial: com.alfredo.compravendagado.offline v184"

      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar APK sem internet no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install android-app/app/build/outputs/apk/debug/app-debug.apk
            adb install android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w com.alfredo.compravendagado.offline.test/android.test.InstrumentationTestRunner | tee /tmp/offline-test.txt
            grep -q 'OK (1 test)' /tmp/offline-test.txt

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: compra-venda-gado-v184-oficial-offline
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
