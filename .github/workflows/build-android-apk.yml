name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - "android-app/**"
      - "v85-fixes.js"
      - "v98-reconnect-login.js"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: android-apk

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar site offline v98
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/assets/site
          mkdir -p android-app/app/src/main/res/drawable
          for f in index.html app-v68.html painel-update-v63.js v85-fixes.js v98-reconnect-login.js sw.js manifest.webmanifest icon.svg app-boi-180.png app-boi-192.png app-boi-512.png icon-192.png icon-512.png apple-touch-icon.png favicon.png; do
            if [ -f "$f" ]; then cp "$f" android-app/app/src/main/assets/site/; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','app-v68.html'):
              p=Path('android-app/app/src/main/assets/site')/name
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("setInterval(()=>{if(navigator.onLine)sync(false)},8000);", "/* v98: polling legado desativado */")
              s=re.sub(r'\s*<script src="/v85-fixes\.js\?v=\d+"></script>\s*', '\n', s)
              s=re.sub(r'\s*<script src="/v98-reconnect-login\.js\?v=\d+"></script>\s*', '\n', s)
              s=s.replace('</body>','<script src="/v85-fixes.js?v=98"></script>\n<script src="/v98-reconnect-login.js?v=98"></script>\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" -o android-app/app/src/main/assets/site/supabase.js
          cp app-boi-512.png android-app/app/src/main/res/drawable/app_boi.png

      - name: Criar arquivo de assinatura
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android-app/app-release.jks
          test -s android-app/app-release.jks

      - name: Gerar APK release assinado
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ../app-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Compra-Venda-Gado-v98
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
