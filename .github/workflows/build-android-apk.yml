name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - "android-app/**"
      - "v85-fixes.js"
      - "v101-apk-session-guard.js"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: android-apk

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar site local v105
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/assets/site
          mkdir -p android-app/app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/index.html" -o android-app/app/src/main/assets/site/index.html
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/app-v68.html" -o android-app/app/src/main/assets/site/app-v68.html
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/v85-fixes.js" -o android-app/app/src/main/assets/site/v85-fixes.js
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/android-apk/v101-apk-session-guard.js" -o android-app/app/src/main/assets/site/v101-apk-session-guard.js
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/v103-pdf-open.js" -o android-app/app/src/main/assets/site/v103-pdf-open.js
          for f in sw.js manifest.webmanifest icon.svg app-boi-180.png app-boi-192.png app-boi-512.png icon-192.png icon-512.png apple-touch-icon.png favicon.png; do
            curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/$f" -o "android-app/app/src/main/assets/site/$f" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          replacement = "function fileLink(doc,label){\n if(!doc||!doc.data)return '—';\n window.__pdfDocsV85=window.__pdfDocsV85||{};\n var id='pdf-'+Math.random().toString(36).slice(2)+Date.now().toString(36);\n window.__pdfDocsV85[id]=doc;\n return '<button type=\"button\" class=\"mini\" onclick=\"openStoredPdfV85(&quot;'+id+'&quot;)\">Abrir PDF</button>';\n}"
          force = "<script id=\"force-app-version-v105\">(function(){function f(){try{document.title='Compra e Venda de Gado — v105';var h=document.querySelector('header h1');if(!h)return;var spans=h.querySelectorAll('span');for(var i=0;i<spans.length;i++){if(/^v\\d+$/i.test((spans[i].textContent||'').trim())){spans[i].textContent='v105';break;}}}catch(e){}}f();setInterval(f,1200);})();</script>"
          for name in ('index.html','app-v68.html'):
              p=Path('android-app/app/src/main/assets/site')/name
              s=p.read_text(encoding='utf-8')
              s,_=re.subn(r'function fileLink\(doc,label\)\{.*?\n\}', replacement, s, count=1, flags=re.S)
              s=re.sub(r'<title>Compra e Venda de Gado — v\d+</title>','<title>Compra e Venda de Gado — v105</title>',s)
              s=re.sub(r'(<h1>Compra e Venda de Gado <span[^>]*>)v\d+(</span></h1>)',r'\1v105\2',s)
              s=re.sub(r'\s*<script src="/v101-apk-session-guard\.js\?v=\d+"></script>\s*','\n',s)
              s=re.sub(r'\s*<script src="/v103-pdf-open\.js\?v=\d+"></script>\s*','\n',s)
              s=re.sub(r'\s*<script id="force-web-version-v\d+">.*?</script>\s*','\n',s,flags=re.S)
              s=re.sub(r'if\s*\(\s*["\']serviceWorker["\']\s*in\s*navigator\s*\)\s*\{.*?\}','',s,flags=re.S)
              s=s.replace('</body>','<script src="/v101-apk-session-guard.js?v=105"></script>\n<script src="/v103-pdf-open.js?v=105"></script>\n'+force+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" -o android-app/app/src/main/assets/site/supabase.js
          curl -fsSL "https://raw.githubusercontent.com/AlfredoNQ/compra-venda-gado/main/app-boi-512.png" -o android-app/app/src/main/res/drawable/app_boi.png

      - name: Ajustar WebView nativa v105
        shell: python
        run: |
          from pathlib import Path
          p=Path('android-app/app/src/main/java/com/alfredo/compravendagado/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CompraVendaGadoApp/104','CompraVendaGadoApp/105')
          s=s.replace("b.textContent='APP v104'","b.textContent='APP v105'")
          s=s.replace("spans[i].textContent='v104'","spans[i].textContent='v105'")
          s=s.replace('/?app=v104','/?app=v105')
          s=s.replace('return isOnline() ? super.shouldInterceptRequest(view, request) : offlineResponse(request.getUrl());', 'WebResourceResponse local=offlineResponse(request.getUrl()); if(local!=null)return local; return super.shouldInterceptRequest(view, request);')
          s=s.replace('return isOnline() ? super.shouldInterceptRequest(view, url) : offlineResponse(Uri.parse(url));', 'WebResourceResponse local=offlineResponse(Uri.parse(url)); if(local!=null)return local; return super.shouldInterceptRequest(view, url);')
          s=s.replace('runOnUiThread(() -> {\n                try {', 'runOnUiThread(() -> {\n                Toast.makeText(MainActivity.this,"PDF recebido • abrindo...",Toast.LENGTH_SHORT).show();\n                try {', 1)
          s=s.replace('try {\n                        startActivity(intent);\n                    } catch(Exception noViewer) {\n                        Toast.makeText(MainActivity.this,"PDF salvo em Downloads/CompraVendaGado",Toast.LENGTH_LONG).show();\n                    }', 'try {\n                        startActivity(Intent.createChooser(intent,"Abrir PDF com"));\n                    } catch(Exception noViewer) {\n                        Toast.makeText(MainActivity.this,"PDF salvo em Downloads/CompraVendaGado",Toast.LENGTH_LONG).show();\n                    }')
          marker='                );\n            }\n\n            @Override public WebResourceResponse shouldInterceptRequest'
          inject='                );\n                view.evaluateJavascript("(function(){try{if(!sessionStorage.getItem(\'apk105fresh\')){sessionStorage.setItem(\'apk105fresh\',\'1\');var jobs=[];if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));Promise.all(jobs).finally(function(){location.replace(location.origin+\'/?app=v105&local=1\');});}}catch(e){}})();", null);\n            }\n\n            @Override public WebResourceResponse shouldInterceptRequest'
          s=s.replace(marker,inject,1)
          p.write_text(s,encoding='utf-8')

      - name: Criar arquivo de assinatura
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android-app/app-release.jks
          test -s android-app/app-release.jks

      - name: Gerar APK release assinado
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ../app-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean assembleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Compra-Venda-Gado-v105
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
