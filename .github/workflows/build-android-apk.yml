name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: android-apk
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar modo offline v77
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/assets/site
          mkdir -p android-app/app/src/main/res/drawable
          for f in index.html app-v68.html painel-update-v63.js sw.js manifest.webmanifest icon.svg \
                   app-boi-180.png app-boi-192.png app-boi-512.png icon-192.png icon-512.png \
                   apple-touch-icon.png favicon.png; do
            if [ -f "$f" ]; then cp "$f" android-app/app/src/main/assets/site/; fi
          done
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" \
            -o android-app/app/src/main/assets/site/supabase.js
          cp app-boi-512.png android-app/app/src/main/res/drawable/app_boi.png
      - name: Gerar APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Compra-Venda-Gado-v78-Offline-Sync-Multidispositivo
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
