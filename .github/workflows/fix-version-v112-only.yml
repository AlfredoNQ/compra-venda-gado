name: Fix Web Version v112 Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-version-v112-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixar somente a versão visual em v112
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # HTML: título e badge inicial já começam em v112.
          for name in ('index.html','app-v68.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<title>Compra e Venda de Gado — v\d+</title>', '<title>Compra e Venda de Gado — v112</title>', s)
              s=re.sub(r'(<h1>Compra e Venda de Gado <span[^>]*>)v\d+(</span></h1>)', r'\1v112\2', s)
              # Remove somente scripts inline legados cuja única função é forçar versão.
              s=re.sub(r'\s*<script id="force-web-version-v\d+">.*?</script>\s*', '\n', s, flags=re.S)
              p.write_text(s,encoding='utf-8')

          # v85-fixes: preservar toda a lógica de sync/login/PDF e neutralizar APENAS o escritor visual v96.
          p=Path('v85-fixes.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace("window.APP_WEB_VERSION='96';", "window.APP_WEB_VERSION='112';")
              s=s.replace("document.body.setAttribute('data-app-version','96');document.title='Compra e Venda de Gado — v96';", "document.body.setAttribute('data-app-version','112');document.title='Compra e Venda de Gado — v112';")
              s=s.replace("s.textContent='v96';found=true;", "s.textContent='v112';found=true;")
              s=s.replace("b.textContent='v96';", "b.textContent='v112';")
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v68.html v85-fixes.js
          git diff --cached --quiet || git commit -m "Web: fixa indicador visual em v112 sem tocar no sistema"
          git push
