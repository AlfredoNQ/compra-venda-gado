<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ponte Vercel → GitHub</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f1f6f3;margin:0;padding:20px;color:#222}
    .box{max-width:720px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 3px 18px #0002}
    h1{color:#176b45}
    label{display:block;margin-top:16px;margin-bottom:6px}
    input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
    button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:#176b45;color:white;font-weight:bold;font-size:16px}
    button:disabled{opacity:.6}
    #status{margin-top:18px;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="box">
  <h1>Compra e Venda de Gado</h1>
  <p>Ponte Vercel → GitHub</p>

  <label>Senha da ponte</label>
  <input id="secret" type="password" autocomplete="off">

  <label>Branch de destino</label>
  <select id="branch">
    <option value="android-apk">android-apk</option>
    <option value="main">main</option>
  </select>

  <label>Arquivo ZIP</label>
  <input id="zip" type="file" accept=".zip,application/zip">

  <button id="send" onclick="publicar()">Publicar ZIP no GitHub</button>

  <div id="status"></div>
</div>

<script>
async function publicar(){
  const secret=document.getElementById('secret').value;
  const branch=document.getElementById('branch').value;
  const file=document.getElementById('zip').files[0];
  const status=document.getElementById('status');
  const btn=document.getElementById('send');

  if(!secret){
    status.textContent='Digite a senha da ponte.';
    return;
  }

  if(!file){
    status.textContent='Selecione o arquivo ZIP.';
    return;
  }

  const form=new FormData();
  form.append('secret',secret);
  form.append('branch',branch);
  form.append('file',file);

  btn.disabled=true;
  status.textContent='Publicando... aguarde.';

  try{
    const r=await fetch('/api/publish-zip',{
      method:'POST',
      body:form
    });

    const text=await r.text();

    if(!r.ok){
      throw new Error(text || ('Erro HTTP '+r.status));
    }

    status.textContent='✅ Publicado com sucesso!\n'+text;
  }catch(e){
    status.textContent='❌ Erro: '+e.message;
  }finally{
    btn.disabled=false;
  }
}
</script>
</body>
</html>
