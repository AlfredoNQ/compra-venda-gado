plugins { id 'com.android.application' }

android {
    namespace 'com.alfredo.compravendagado'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: '../app-release.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.alfredo.compravendagado.offline'
        minSdk 24
        targetSdk 35
        versionCode 184
        versionName '184.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/offline-assets'))
tasks.register('prepareOfflineSite', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android-app/prepare_offline.py',
        layout.buildDirectory.dir('generated/offline-assets/site').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'prepareOfflineSite' }
