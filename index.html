<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte Vercel — Compra e Venda de Gado</title>
<style>
body{font-family:system-ui;background:#eef3ef;margin:0;padding:18px;color:#183526}
.card{max-width:680px;margin:24px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 35px #0001}
h1{color:#17633f;margin-top:0}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccd8cf;border-radius:9px;font:inherit}
button{background:#17633f;color:#fff;font-weight:800;border:0}.ok{color:#17633f;font-weight:800}.err{color:#b42318;font-weight:800}
</style>
</head><body><div class="card">
<h1>Compra e Venda de Gado</h1><p><b>Ponte Vercel → GitHub</b></p>
<label>Senha da ponte</label><input id="s" type="password">
<label>Branch</label><select id="b"><option>main</option><option>android-apk</option></select>
<label>Arquivo ZIP</label><input id="z" type="file" accept=".zip,application/zip">
<button onclick="pub()">Publicar ZIP no GitHub</button><div id="st"></div>
</div>
<script>
async function pub(){
 const st=document.getElementById('st'), f=z.files[0];
 if(!f){st.textContent='Escolha o ZIP.';st.className='err';return}
 st.textContent='Lendo ZIP...';st.className='';
 const a=new Uint8Array(await f.arrayBuffer());
 let bin='',chunk=0x8000;
 for(let i=0;i<a.length;i+=chunk)bin+=String.fromCharCode.apply(null,a.subarray(i,Math.min(i+chunk,a.length)));
 st.textContent='Publicando...';
 try{
  const r=await fetch('/api/publish-zip',{method:'POST',headers:{'Content-Type':'application/json','X-Bridge-Secret':s.value},
    body:JSON.stringify({branch:b.value,zip_b64:btoa(bin)})});
  const j=await r.json();
  if(!r.ok||!j.ok) throw Error(j.error||'Falha');
  st.textContent='Publicado com sucesso: '+j.files+' arquivos. Commit '+j.commit;
  st.className='ok';
 }catch(e){st.textContent='Erro: '+e.message;st.className='err'}
}
</script></body></html>
